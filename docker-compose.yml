services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sevasaathi
      POSTGRES_USER: sevasaathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevasaathi -d sevasaathi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        PRISMA_SCHEMA: prisma/schema.postgresql.prisma
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sevasaathi:${POSTGRES_PASSWORD}@database:5432/sevasaathi?schema=public
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      APP_BASE_URL: http://localhost:4000
      UPLOAD_DIR: /app/storage/uploads
      BACKUP_DIR: /app/storage/backups
    volumes:
      - backend_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
